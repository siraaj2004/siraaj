name: YouTube Trend Analysis

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"
    - cron: "30 6 * * *"
    - cron: "30 10 * * *"
    - cron: "0 16 * * *"

jobs:
  trend-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Repository Files
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found."
          fi

      - name: Create .env File
        run: |
          echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "RECIPIENT_EMAIL=${{ secrets.RECIPIENT_EMAIL }}" >> .env
          echo "FROM_EMAIL=${{ secrets.FROM_EMAIL }}" >> .env
          echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env

      - name: Run YouTube Trend Analysis
        run: |
          if [ -f "src/app.py" ]; then
            echo "Found src/app.py"
            python src/app.py
          elif [ -f "app.py" ]; then
            echo "Found app.py"
            python app.py
          else
            echo "ERROR: app.py was not found!"
            echo "Available Python files:"
            find . -type f -name "*.py" | sort
            exit 1
          fi

      - name: Upload Generated PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trend-analysis-report
          path: |
            *.pdf
            output/*.pdf
            reports/*.pdf
          if-no-files-found: ignore
