name: YouTube Trend Analysis

on:
  workflow_dispatch:

  schedule:
    # Runs every hour
    - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  youtube-trend:

    runs-on: ubuntu-latest

    env:

      # --------------------------------------------
      # YouTube
      # --------------------------------------------

      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      # --------------------------------------------
      # AI
      # --------------------------------------------

      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      # --------------------------------------------
      # Gmail
      # --------------------------------------------

      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_TO: ${{ secrets.GMAIL_TO }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

    steps:

      # ============================================
      # CHECKOUT
      # ============================================

      - name: Checkout Repository
        uses: actions/checkout@v5

      # ============================================
      # PYTHON
      # ============================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ============================================
      # INSTALL
      # ============================================

      - name: Install Dependencies
        run: |

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install reportlab

      # ============================================
      # CREATE FOLDERS
      # ============================================

      - name: Create Required Folders
        run: |

          mkdir -p data
          mkdir -p summaries
          mkdir -p reports

      # ============================================
      # RUN APP
      # ============================================

      - name: Run YouTube Trend Analysis
        run: |

          python src/app.py

      # ============================================
      # SHOW FILES
      # ============================================

      - name: Show Generated Files
        run: |

          echo "======================================"
          echo "DATA FILES"
          echo "======================================"

          find data -type f -print || true

          echo "======================================"
          echo "SUMMARY FILES"
          echo "======================================"

          find summaries -type f -print || true

          echo "======================================"
          echo "REPORT FILES"
          echo "======================================"

          find reports -type f -print || true

      # ============================================
      # UPLOAD PDF
      # ============================================

      - name: Upload Generated PDF
        uses: actions/upload-artifact@v6
        with:
          name: youtube-trend-report
          path: reports/*.pdf
          if-no-files-found: error
          retention-days: 7
