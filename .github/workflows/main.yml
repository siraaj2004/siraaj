name: YouTube High CTR Idea Generator

on:
  schedule:
    # Run every hour, 24 hours a day
    - cron: "0 * * * *"

  # Allows you to manually run the workflow from GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  youtube-idea-generator:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Setup Python
      # ==========================================
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================
      # 3. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # ==========================================
      # 4. Check environment
      # ==========================================
      - name: Check environment
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          echo "=============================================="
          echo "CHECKING ENVIRONMENT"
          echo "=============================================="

          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY: MISSING"
            exit 1
          else
            echo "YOUTUBE_API_KEY: OK"
          fi

          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY: MISSING"
            exit 1
          else
            echo "OPENROUTER_API_KEY: OK"
          fi

          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY: MISSING"
            exit 1
          else
            echo "RESEND_API_KEY: OK"
          fi

          if [ -z "$FROM_EMAIL" ]; then
            echo "FROM_EMAIL: MISSING"
            exit 1
          else
            echo "FROM_EMAIL: OK"
          fi

          if [ -z "$RECIPIENT_EMAIL" ]; then
            echo "RECIPIENT_EMAIL: MISSING"
            exit 1
          else
            echo "RECIPIENT_EMAIL: OK"
          fi

      # ==========================================
      # 5. Run generator
      # ==========================================
      - name: Run YouTube High CTR Idea Generator
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          set -euxo pipefail

          echo "=============================================="
          echo "STARTING YOUTUBE HIGH CTR IDEA GENERATOR"
          echo "=============================================="

          echo "Python:"
          python --version

          echo "Running src/app.py"
          python src/app.py

          echo "=============================================="
          echo "GENERATOR FINISHED"
          echo "=============================================="

      # ==========================================
      # 6. Upload generated files
      # ==========================================
      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-ideas-${{ github.run_number }}
          path: |
            output/
            summaries/
          if-no-files-found: ignore
          retention-days: 7
