name: YouTube Trend Analysis

on:
  workflow_dispatch:

  schedule:
    # IST Timings: 9:00 AM, 12:00 PM, 4:00 PM, 8:00 PM
    # Converted to UTC (IST = UTC + 5:30):
    # 9:00 AM IST = 03:30 UTC
    - cron: "30 3 * * *"
    # 12:00 PM IST = 06:30 UTC
    - cron: "30 6 * * *"
    # 4:00 PM IST = 10:30 UTC
    - cron: "30 10 * * *"
    # 8:00 PM IST = 14:30 UTC
    - cron: "30 14 * * *"

jobs:
  trend-analysis:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. PYTHON
      # ==========================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # 3. INSTALL DEPENDENCIES
      # ==========================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==========================================
      # 4. CREATE .env
      # ==========================================

      - name: Create .env File
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}

        run: |
          mkdir -p src
          cat > src/.env <<EOF
          YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          RESEND_API_KEY=${RESEND_API_KEY}
          FROM_EMAIL=${FROM_EMAIL}
          RECIPIENT_EMAIL=${RECIPIENT_EMAIL}
          EOF


      # ==========================================
      # 5. VERIFY ENVIRONMENT
      # ==========================================

      - name: Verify Environment
        run: |
          python - <<'PY'
          import os
          from dotenv import load_dotenv
          
          load_dotenv("src/.env")
          
          variables = [
              "YOUTUBE_API_KEY",
              "GEMINI_API_KEY",
              "RESEND_API_KEY",
              "FROM_EMAIL",
              "RECIPIENT_EMAIL",
          ]
          
          print("Checking environment variables...")
          
          failed = False
          
          for name in variables:
              value = os.getenv(name)
              
              if value:
                  print(f"✓ {name} found")
              else:
                  print(f"❌ {name} missing")
                  failed = True
          
          if failed:
              raise SystemExit("Required environment variables are missing.")
          
          print("✓ All required environment variables found")
          PY


      # ==========================================
      # 6. RUN MAIN APP
      # ==========================================

      - name: Run YouTube Trend Analysis
        run: |
          python src/idea_generator.py


      # ==========================================
      # 7. UPLOAD PDF
      # ==========================================

      - name: Upload Generated PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-trend-report
          path: |
            src/reports/*.pdf
            src/output/*.pdf
            src/generated/*.pdf
            src/pdf/*.pdf
          if-no-files-found: ignore
