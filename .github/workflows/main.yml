name: YouTube Trend Intelligence

on:
workflow_dispatch:
schedule:
- cron: 0 * * * *

jobs:
youtube-trend-intelligence:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: 3.12
      cache: pip

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Check required secrets
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_TO: ${{ secrets.GMAIL_TO }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    run: |
      set -e

      echo Checking required secrets...

      if [ -z "$YOUTUBE_API_KEY" ]; then
        echo ERROR: YOUTUBE_API_KEY is missing
        exit 1
      fi

      if [ -z "$GEMINI_API_KEY" ]; then
        echo ERROR: GEMINI_API_KEY is missing
        exit 1
      fi

      if [ -z "$GMAIL_USER" ]; then
        echo ERROR: GMAIL_USER is missing
        exit 1
      fi

      if [ -z "$GMAIL_TO" ]; then
        echo ERROR: GMAIL_TO is missing
        exit 1
      fi

      if [ -z "$GMAIL_APP_PASSWORD" ]; then
        echo ERROR: GMAIL_APP_PASSWORD is missing
        exit 1
      fi

      echo All required secrets are available.

  - name: Run YouTube Trend Intelligence
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_TO: ${{ secrets.GMAIL_TO }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    run: |
      set -e

      echo ==============================================
      echo STARTING YOUTUBE TREND INTELLIGENCE
      echo ==============================================

      python src/app.py

  - name: Upload generated files
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: youtube-trend-reports
      path: |
        reports/
        summaries/
        data/
      if-no-files-found: ignore
