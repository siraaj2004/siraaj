name: YouTube High CTR Idea Generator

on:
  schedule:
    # Run every hour
    - cron: "0 * * * *"

  # Allows manual execution from GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  youtube-idea-generator:

    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ==========================================
      # 2. SETUP PYTHON
      # ==========================================

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"


      # ==========================================
      # 3. INSTALL DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        shell: bash
        run: |

          set -euo pipefail

          echo "=============================================="
          echo "INSTALLING DEPENDENCIES"
          echo "=============================================="

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found."
            exit 1
          fi

          echo "Dependencies installed successfully."


      # ==========================================
      # 4. CHECK ENVIRONMENT
      # ==========================================

      - name: Check environment
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}

        shell: bash
        run: |

          set -euo pipefail

          echo "=============================================="
          echo "CHECKING ENVIRONMENT"
          echo "=============================================="

          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY: MISSING"
            exit 1
          else
            echo "YOUTUBE_API_KEY: OK"
          fi

          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY: MISSING"
            exit 1
          else
            echo "OPENROUTER_API_KEY: OK"
          fi

          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY: MISSING"
            exit 1
          else
            echo "RESEND_API_KEY: OK"
          fi

          if [ -z "$FROM_EMAIL" ]; then
            echo "FROM_EMAIL: MISSING"
            exit 1
          else
            echo "FROM_EMAIL: OK"
          fi

          if [ -z "$RECIPIENT_EMAIL" ]; then
            echo "RECIPIENT_EMAIL: MISSING"
            exit 1
          else
            echo "RECIPIENT_EMAIL: OK"
          fi

          echo "=============================================="
          echo "ALL REQUIRED SECRETS ARE PRESENT"
          echo "=============================================="


      # ==========================================
      # 5. RUN GENERATOR
      # ==========================================

      - name: Run YouTube High CTR Idea Generator
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}

        shell: bash
        run: |

          set -euxo pipefail

          echo "=============================================="
          echo "STARTING YOUTUBE HIGH CTR IDEA GENERATOR"
          echo "=============================================="

          echo "Python:"
          python --version

          echo ""
          echo "Running src/app.py..."
          python src/app.py

          echo ""
          echo "=============================================="
          echo "GENERATOR FINISHED"
          echo "=============================================="


      # ==========================================
      # 6. VERIFY OUTPUT
      # ==========================================

      - name: Verify generated files
        shell: bash
        run: |

          set -euo pipefail

          echo "=============================================="
          echo "VERIFYING GENERATED FILES"
          echo "=============================================="

          if [ ! -f "output/youtube_high_ctr_report.txt" ]; then
            echo "ERROR: TXT report was not generated."
            exit 1
          fi

          if [ ! -f "output/youtube_high_ctr_report.json" ]; then
            echo "ERROR: JSON report was not generated."
            exit 1
          fi

          echo ""
          echo "TXT report:"
          ls -lh output/youtube_high_ctr_report.txt

          echo ""
          echo "JSON report:"
          ls -lh output/youtube_high_ctr_report.json

          echo ""
          echo "OUTPUT FILES VERIFIED"


      # ==========================================
      # 7. SHOW EMAIL CONFIGURATION
      # ==========================================
      # Does NOT print secret values.

      - name: Verify email configuration
        env:
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}

        shell: bash
        run: |

          set -euo pipefail

          echo "=============================================="
          echo "VERIFYING EMAIL CONFIGURATION"
          echo "=============================================="

          echo "FROM_EMAIL is configured."
          echo "RECIPIENT_EMAIL is configured."

          echo "Email configuration looks OK."


      # ==========================================
      # 8. UPLOAD GENERATED FILES
      # ==========================================

      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: youtube-ideas-${{ github.run_number }}

          path: |
            output/
            summaries/

          if-no-files-found: ignore

          retention-days: 7
