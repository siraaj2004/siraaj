name: YouTube Trend Intelligence

on:
  workflow_dispatch:

  schedule:
    # 08:30 IST
    - cron: "0 3 * * *"

    # 12:00 IST
    - cron: "30 6 * * *"

    # 16:00 IST
    - cron: "30 10 * * *"

    # 21:30 IST
    - cron: "0 16 * * *"

jobs:
  youtube-trend-intelligence:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # SETUP PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # CHECK PYTHON
      # ======================================================

      - name: Check Python environment
        run: |
          python --version
          pip --version


      # ======================================================
      # CHECK REQUIRED SECRETS
      # ======================================================

      - name: Check environment variables
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

        run: |
          set -e

          echo "Checking required secrets..."

          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "ERROR: YOUTUBE_API_KEY is missing"
            exit 1
          else
            echo "OK: YOUTUBE_API_KEY found"
          fi

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY is missing"
            exit 1
          else
            echo "OK: GEMINI_API_KEY found"
          fi

          if [ -z "$GMAIL_USER" ]; then
            echo "ERROR: GMAIL_USER is missing"
            exit 1
          else
            echo "OK: GMAIL_USER found"
          fi

          if [ -z "$GMAIL_TO" ]; then
            echo "ERROR: GMAIL_TO is missing"
            exit 1
          else
            echo "OK: GMAIL_TO found"
          fi

          if [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "ERROR: GMAIL_APP_PASSWORD is missing"
            exit 1
          else
            echo "OK: GMAIL_APP_PASSWORD found"
          fi

          echo "All required secrets are available."


      # ======================================================
      # RUN YOUTUBE TREND INTELLIGENCE
      # ======================================================

      - name: Run YouTube Trend Intelligence
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

        run: |
          set -e

          echo ""
          echo "=============================================="
          echo "STARTING YOUTUBE TREND INTELLIGENCE"
          echo "=============================================="

          python src/app.py


      # ======================================================
      # UPLOAD GENERATED REPORTS
      # ======================================================

      - name: Upload generated reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-trend-reports
          path: |
            reports/
            summaries/
            data/
          if-no-files-found: ignore
```
