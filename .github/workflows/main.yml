name: YouTube High CTR Idea Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests reportlab

      - name: Run YouTube High CTR Generator
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          echo "=============================================="
          echo "STARTING YOUTUBE HIGH CTR IDEA GENERATOR"
          echo "=============================================="
          python src/app.py

      - name: Show generated files
        if: always()
        run: |
          echo "=============================================="
          echo "GENERATED FILES"
          echo "=============================================="
          find data reports -maxdepth 2 -type f -print 2>/dev/null | sort || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-high-ctr-results
          path: |
            data/youtube_high_ctr_ideas.json
            reports/*.pdf
            reports/*.txt
          if-no-files-found: warn
