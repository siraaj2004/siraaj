name: YouTube High CTR Idea Generator

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  generate-and-email:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install requests python-dotenv

      - name: Find main.py
        id: find_main
        shell: bash
        run: |
          MAIN_FILE=$(find . -type f -name main.py -not -path './.git/*' | head -n 1)

          if [ -z "$MAIN_FILE" ]; then
            echo 'ERROR: main.py not found'
            find . -type f -name '*.py' -not -path './.git/*'
            exit 1
          fi

          echo "Found main.py: $MAIN_FILE"
          echo "main_file=$MAIN_FILE" >> "$GITHUB_OUTPUT"

      - name: Run YouTube Generator
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -e

          echo '======================================================================'
          echo 'STARTING YOUTUBE HIGH CTR IDEA GENERATOR'
          echo '======================================================================'

          python '${{ steps.find_main.outputs.main_file }}'

          echo '======================================================================'
          echo 'GENERATOR COMPLETED'
          echo '======================================================================'

      - name: Find generated JSON
        id: find_result
        shell: bash
        run: |
          RESULT_FILE=$(find . \
            -type f \
            -name youtube_high_ctr_ideas.json \
            -not -path './.git/*' \
            | head -n 1)

          if [ -z "$RESULT_FILE" ]; then
            echo 'ERROR: youtube_high_ctr_ideas.json not found'
            exit 1
          fi

          echo "Result file: $RESULT_FILE"
          echo "result_file=$RESULT_FILE" >> "$GITHUB_OUTPUT"

      - name: Find Gmail sender
        id: find_gmail
        shell: bash
        run: |
          GMAIL_FILE=$(find . \
            -type f \
            -name gmail_sender.py \
            -not -path './.git/*' \
            | head -n 1)

          if [ -z "$GMAIL_FILE" ]; then
            echo 'ERROR: gmail_sender.py not found'
            exit 1
          fi

          echo "Gmail sender: $GMAIL_FILE"
          echo "gmail_file=$GMAIL_FILE" >> "$GITHUB_OUTPUT"

      - name: Send Email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          EMAIL_SUBJECT: 'YouTube High CTR Ideas - Hourly'
          YOUTUBE_RESULT_FILE: ${{ steps.find_result.outputs.result_file }}
        shell: bash
        run: |
          set -e

          echo '======================================================================'
          echo 'SENDING EMAIL'
          echo '======================================================================'

          python '${{ steps.find_gmail.outputs.gmail_file }}'

          echo '======================================================================'
          echo 'EMAIL SENT SUCCESSFULLY'
          echo '======================================================================'

      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-high-ctr-results-${{ github.run_number }}
          path: '**/youtube_high_ctr_ideas.json'
          if-no-files-found: error
          retention-days: 7
