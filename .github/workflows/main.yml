name: YouTube Trend Intelligence

on:
  workflow_dispatch:

  schedule:
    - cron: 0 0-23/1 1-31 1-12 0-6

jobs:
  youtube-trend-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check secrets
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          set -e

          echo Checking secrets...

          test -n "$YOUTUBE_API_KEY" || {
            echo ERROR: YOUTUBE_API_KEY is missing
            exit 1
          }

          test -n "$GEMINI_API_KEY" || {
            echo ERROR: GEMINI_API_KEY is missing
            exit 1
          }

          test -n "$GMAIL_USER" || {
            echo ERROR: GMAIL_USER is missing
            exit 1
          }

          test -n "$GMAIL_TO" || {
            echo ERROR: GMAIL_TO is missing
            exit 1
          }

          test -n "$GMAIL_APP_PASSWORD" || {
            echo ERROR: GMAIL_APP_PASSWORD is missing
            exit 1
          }

          echo All secrets are available

      - name: Run YouTube Trend Intelligence
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          set -e

          echo ==============================================
          echo STARTING YOUTUBE TREND INTELLIGENCE
          echo ==============================================

          python src/app.py

          echo ==============================================
          echo YOUTUBE TREND INTELLIGENCE COMPLETED
          echo ==============================================

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-trend-reports
          path: |
            reports/
            summaries/
            data/
          if-no-files-found: ignore
