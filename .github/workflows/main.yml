name: YouTube Trend Analysis

on:
  workflow_dispatch:

  schedule:
    # 9:00 AM IST = 03:30 UTC
    - cron: "30 3 * * *"

    # 12:00 PM IST = 06:30 UTC
    - cron: "30 6 * * *"

    # 4:00 PM IST = 10:30 UTC
    - cron: "30 10 * * *"

    # 8:00 PM IST = 14:30 UTC
    - cron: "30 14 * * *"

jobs:
  trend-analysis:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Create .env File
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}

        run: |
          cat > src/.env << EOF
          YOUTUBE_API_KEY=$YOUTUBE_API_KEY
          GEMINI_API_KEY=$GEMINI_API_KEY
          RESEND_API_KEY=$RESEND_API_KEY
          FROM_EMAIL=$FROM_EMAIL
          RECIPIENT_EMAIL=$RECIPIENT_EMAIL
          EOF


      - name: Verify Environment
        run: |
          python - <<'PY'
          import os
          from dotenv import load_dotenv

          load_dotenv("src/.env")

          variables = [
              "YOUTUBE_API_KEY",
              "GEMINI_API_KEY",
              "RESEND_API_KEY",
              "FROM_EMAIL",
              "RECIPIENT_EMAIL",
          ]

          print("\nChecking environment variables...\n")

          failed = False

          for name in variables:
              if os.getenv(name):
                  print(f"✓ {name} found")
              else:
                  print(f"❌ {name} missing")
                  failed = True

          if failed:
              raise SystemExit(
                  "Required environment variables are missing."
              )

          print("\n✓ All environment variables found\n")
          PY


      - name: Show Run Time
        run: |
          echo "UTC Time:"
          date -u

          echo "IST Time:"
          TZ=Asia/Kolkata date


      - name: Run YouTube Trend Analysis
        working-directory: .
        run: |
          python src/idea_generator.py


      - name: Upload Generated PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-trend-report-${{ github.run_number }}

          path: |
            src/reports/*.pdf
            src/output/*.pdf
            src/generated/*.pdf
            src/pdf/*.pdf

          if-no-files-found: ignore
