name: YouTube High CTR Idea Generator

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run YouTube High CTR Generator
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          echo "=============================================="
          echo "STARTING YOUTUBE HIGH CTR IDEA GENERATOR"
          echo "=============================================="

          python src/app.py

      - name: Show generated files
        if: always()
        run: |
          echo "=============================================="
          echo "GENERATED FILES"
          echo "=============================================="

          find . -maxdepth 3 -type f | sort

      - name: Upload JSON result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-high-ctr-results
          path: data/youtube_high_ctr_ideas.json
          if-no-files-found: warn
