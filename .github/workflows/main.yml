```yaml
name: YouTube High CTR Idea Generator

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  youtube-idea-generator:

    runs-on: ubuntu-latest

    steps:

      # ==============================================
      # 1. CHECKOUT
      # ==============================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ==============================================
      # 2. SETUP PYTHON
      # ==============================================
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ==============================================
      # 3. INSTALL DEPENDENCIES
      # ==============================================
      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          # Required for TXT -> PDF conversion
          pip install reportlab

      # ==============================================
      # 4. CHECK SECRETS
      # ==============================================
      - name: Check environment
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "CHECKING ENVIRONMENT"
          echo "=============================================="

          if [ -z "${YOUTUBE_API_KEY:-}" ]; then
            echo "ERROR: YOUTUBE_API_KEY is missing"
            exit 1
          fi
          echo "YOUTUBE_API_KEY: OK"

          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "ERROR: RESEND_API_KEY is missing"
            exit 1
          fi
          echo "RESEND_API_KEY: OK"

          if [ -z "${FROM_EMAIL:-}" ]; then
            echo "ERROR: FROM_EMAIL is missing"
            exit 1
          fi
          echo "FROM_EMAIL: OK"

          if [ -z "${RECIPIENT_EMAIL:-}" ]; then
            echo "ERROR: RECIPIENT_EMAIL is missing"
            exit 1
          fi
          echo "RECIPIENT_EMAIL: OK"

          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "OPENROUTER_API_KEY: NOT SET"
            echo "Generator can use fallback mode."
          else
            echo "OPENROUTER_API_KEY: OK"
          fi

      # ==============================================
      # 5. RUN GENERATOR
      # ==============================================
      - name: Run YouTube High CTR Idea Generator
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "STARTING YOUTUBE HIGH CTR IDEA GENERATOR"
          echo "=============================================="

          python --version

          python src/app.py

          echo "=============================================="
          echo "GENERATOR FINISHED"
          echo "=============================================="

      # ==============================================
      # 6. VERIFY TXT + JSON
      # ==============================================
      - name: Verify generated files
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "VERIFYING GENERATED FILES"
          echo "=============================================="

          if [ ! -s "output/youtube_high_ctr_report.txt" ]; then
            echo "ERROR: TXT report missing or empty"
            exit 1
          fi

          if [ ! -s "output/youtube_high_ctr_report.json" ]; then
            echo "ERROR: JSON report missing or empty"
            exit 1
          fi

          echo "TXT report:"
          ls -lh output/youtube_high_ctr_report.txt

          echo "JSON report:"
          ls -lh output/youtube_high_ctr_report.json

          echo "OUTPUT FILES VERIFIED"

      # ==============================================
      # 7. CONVERT TXT -> PDF
      # ==============================================
      - name: Convert report to PDF
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "CREATING PDF REPORT"
          echo "=============================================="

          python - <<'PY'
          from pathlib import Path
          from xml.sax.saxutils import escape

          from reportlab.lib.enums import TA_CENTER
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import ParagraphStyle, getSampleStyleSheet
          from reportlab.lib.units import mm
          from reportlab.platypus import (
              SimpleDocTemplate,
              Paragraph,
              Spacer
          )

          txt_path = Path(
              "output/youtube_high_ctr_report.txt"
          )

          pdf_path = Path(
              "output/youtube_high_ctr_report.pdf"
          )

          if not txt_path.exists():
              raise FileNotFoundError(
                  f"Report not found: {txt_path}"
              )

          text = txt_path.read_text(
              encoding="utf-8",
              errors="replace"
          )

          styles = getSampleStyleSheet()

          title_style = ParagraphStyle(
              "ReportTitle",
              parent=styles["Title"],
              fontName="Helvetica-Bold",
              fontSize=18,
              leading=22,
              alignment=TA_CENTER,
              spaceAfter=12,
          )

          heading_style = ParagraphStyle(
              "Heading",
              parent=styles["Heading2"],
              fontName="Helvetica-Bold",
              fontSize=12,
              leading=15,
              spaceBefore=10,
              spaceAfter=6,
          )

          subheading_style = ParagraphStyle(
              "SubHeading",
              parent=styles["Heading3"],
              fontName="Helvetica-Bold",
              fontSize=10,
              leading=13,
              spaceBefore=7,
              spaceAfter=4,
          )

          body_style = ParagraphStyle(
              "Body",
              parent=styles["BodyText"],
              fontName="Helvetica",
              fontSize=8.5,
              leading=11,
              spaceAfter=2,
              wordWrap="CJK",
          )

          meta_style = ParagraphStyle(
              "Meta",
              parent=body_style,
              fontName="Helvetica-Bold",
              fontSize=8.5,
              leading=11,
          )

          doc = SimpleDocTemplate(
              str(pdf_path),
              pagesize=A4,
              rightMargin=15 * mm,
              leftMargin=15 * mm,
              topMargin=15 * mm,
              bottomMargin=15 * mm,
              title="YouTube High CTR Idea Generator Report",
              author="YouTube High CTR Idea Generator",
          )

          story = []

          lines = text.splitlines()

          first_non_empty = True

          for line in lines:

              stripped = line.strip()

              # Empty line
              if not stripped:
                  story.append(
                      Spacer(1, 4)
                  )
                  continue

              safe = escape(stripped)

              # Main title
              if first_non_empty:
                  story.append(
                      Paragraph(
                          safe,
                          title_style
                      )
                  )
                  first_non_empty = False
                  continue

              # Major section headings
              major_sections = (
                  "TOP HIGH CTR IDEA",
                  "1. INDIA YOUTUBE TRENDS",
                  "2. WORLD YOUTUBE TRENDS",
                  "3. YOUTUBE GENRE TRENDS",
                  "4. INDIA/WORLD TREND-BASED SHORTS IDEAS",
                  "5. INDIA/WORLD TREND-BASED LONG-FORM IDEAS",
                  "6. INDIA/WORLD GENERAL SHORTS IDEAS",
                  "7. INDIA/WORLD GENERAL LONG-FORM IDEAS",
                  "8. GENRE-COMBO HIGH CTR IDEAS",
                  "CREATIVE STANDARD",
              )

              if stripped in major_sections:
                  story.append(
                      Spacer(1, 7)
                  )
                  story.append(
                      Paragraph(
                          safe,
                          heading_style
                      )
                  )
                  continue

              # Underlined separator lines
              if set(stripped) <= {"=", "-"}:
                  continue

              # Secondary headings
              if (
                  stripped.startswith("INDIA LONG-FORM TRENDS")
                  or stripped.startswith("INDIA SHORTS TRENDS")
                  or stripped.startswith("WORLD LONG-FORM TRENDS")
                  or stripped.startswith("WORLD SHORTS TRENDS")
                  or stripped.startswith("LONG-FORM GENRE TRENDS")
                  or stripped.startswith("SHORTS GENRE TRENDS")
              ):
                  story.append(
                      Paragraph(
                          safe,
                          subheading_style
                      )
                  )
                  continue

              # Numbered idea/trend rows
              if (
                  len(stripped) > 2
                  and stripped[0].isdigit()
                  and ". " in stripped[:5]
              ):
                  story.append(
                      Paragraph(
                          safe,
                          subheading_style
                      )
                  )
                  continue

              # Important metadata lines
              if (
                  stripped.startswith("Region:")
                  or stripped.startswith("Format:")
                  or stripped.startswith("Genre:")
                  or stripped.startswith("Sub-genre:")
                  or stripped.startswith("Scores:")
              ):
                  story.append(
                      Paragraph(
                          safe,
                          meta_style
                      )
                  )
                  continue

              # Normal content
              story.append(
                  Paragraph(
                      safe,
                      body_style
                  )
              )

          def add_page_number(canvas, document):
              canvas.saveState()

              canvas.setFont(
                  "Helvetica",
                  7
              )

              canvas.drawCentredString(
                  A4[0] / 2,
                  8 * mm,
                  f"Page {document.page}"
              )

              canvas.restoreState()

          doc.build(
              story,
              onFirstPage=add_page_number,
              onLaterPages=add_page_number
          )

          print(
              "PDF created:",
              pdf_path
          )

          print(
              "PDF size:",
              pdf_path.stat().st_size,
              "bytes"
          )
          PY

          echo "=============================================="
          echo "PDF CREATED"
          echo "=============================================="

          ls -lh output/youtube_high_ctr_report.pdf

      # ==============================================
      # 8. VERIFY PDF
      # ==============================================
      - name: Verify PDF
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "VERIFYING PDF"
          echo "=============================================="

          if [ ! -s "output/youtube_high_ctr_report.pdf" ]; then
            echo "ERROR: PDF missing or empty"
            exit 1
          fi

          file output/youtube_high_ctr_report.pdf

          ls -lh output/youtube_high_ctr_report.pdf

          echo "PDF VERIFIED"

      # ==============================================
      # 9. SEND PDF EMAIL USING RESEND
      # ==============================================
      - name: Send PDF report using Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "SENDING PDF EMAIL THROUGH RESEND"
          echo "=============================================="

          python - <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.error
          from pathlib import Path
          from datetime import datetime, timezone

          API_KEY = os.environ["RESEND_API_KEY"]
          FROM_EMAIL = os.environ["FROM_EMAIL"]
          RECIPIENT_EMAIL = os.environ["RECIPIENT_EMAIL"]
          RUN_NUMBER = os.environ["GITHUB_RUN_NUMBER"]

          PDF_FILE = Path(
              "output/youtube_high_ctr_report.pdf"
          )

          JSON_FILE = Path(
              "output/youtube_high_ctr_report.json"
          )

          # ------------------------------------------
          # Verify PDF
          # ------------------------------------------

          if not PDF_FILE.is_file():
              raise FileNotFoundError(
                  f"PDF not found: {PDF_FILE}"
              )

          if PDF_FILE.stat().st_size == 0:
              raise RuntimeError(
                  "PDF file is empty."
              )

          # ------------------------------------------
          # Encode attachment
          # ------------------------------------------

          def encode_file(path):
              return base64.b64encode(
                  path.read_bytes()
              ).decode("utf-8")

          pdf_content = encode_file(
              PDF_FILE
          )

          json_content = encode_file(
              JSON_FILE
          )

          generated_time = datetime.now(
              timezone.utc
          ).strftime(
              "%Y-%m-%d %H:%M UTC"
          )

          # ------------------------------------------
          # Resend payload
          # ------------------------------------------

          payload = {
              "from": FROM_EMAIL,

              "to": [
                  RECIPIENT_EMAIL
              ],

              "subject": (
                  "YouTube High CTR Idea Report "
                  f"- Run #{RUN_NUMBER}"
              ),

              "text": (
                  "YouTube High CTR Idea Generator\n\n"
                  "Your latest YouTube trend and "
                  "high-CTR idea report is attached "
                  "as a PDF.\n\n"
                  f"Generated: {generated_time}\n"
                  f"GitHub Actions Run: #{RUN_NUMBER}\n\n"
                  "Attachments:\n"
                  "- youtube_high_ctr_report.pdf\n"
                  "- youtube_high_ctr_report.json\n"
              ),

              "attachments": [
                  {
                      "filename": (
                          "youtube_high_ctr_report.pdf"
                      ),
                      "content": pdf_content
                  },
                  {
                      "filename": (
                          "youtube_high_ctr_report.json"
                      ),
                      "content": json_content
                  }
              ]
          }

          data = json.dumps(
              payload
          ).encode("utf-8")

          request = urllib.request.Request(
              "https://api.resend.com/emails",
              data=data,
              method="POST",
              headers={
                  "Authorization": (
                      f"Bearer {API_KEY}"
                  ),
                  "Content-Type": (
                      "application/json"
                  ),
                  "User-Agent": (
                      "GitHub-Actions-"
                      "YouTube-Idea-Generator"
                  )
              }
          )

          try:

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  response_text = (
                      response
                      .read()
                      .decode("utf-8")
                  )

                  print(
                      "=============================================="
                  )
                  print("RESEND RESPONSE")
                  print(
                      "=============================================="
                  )

                  print(response_text)

                  result = json.loads(
                      response_text
                  )

                  email_id = result.get("id")

                  if not email_id:
                      raise RuntimeError(
                          "Resend did not return an email ID."
                      )

                  print(
                      "=============================================="
                  )
                  print(
                      "PDF EMAIL SENT SUCCESSFULLY"
                  )
                  print(
                      "Resend Email ID:",
                      email_id
                  )
                  print(
                      "=============================================="
                  )

          except urllib.error.HTTPError as error:

              error_body = (
                  error
                  .read()
                  .decode(
                      "utf-8",
                      errors="replace"
                  )
              )

              print(
                  "=============================================="
              )
              print("RESEND EMAIL FAILED")
              print(
                  "=============================================="
              )

              print(
                  "HTTP STATUS:",
                  error.code
              )

              print(
                  "RESPONSE:",
                  error_body
              )

              raise

          except Exception as error:

              print(
                  "=============================================="
              )
              print("EMAIL SENDING FAILED")
              print(
                  "=============================================="
              )

              print(
                  "ERROR:",
                  str(error)
              )

              raise

      # ==============================================
      # 10. UPLOAD ALL OUTPUT FILES
      # ==============================================
      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-ideas-${{ github.run_number }}
          path: |
            output/
            summaries/
          if-no-files-found: ignore
          retention-days: 7
```
